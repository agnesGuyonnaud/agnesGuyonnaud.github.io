<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Projets Scolaires</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .carousel-item { display: flex; justify-content: center; }
        .project-card { width: 30%; margin: 0 10px; }
    </style>
</head>
<body>
    <h1>Mon Portfolio de Projets Scolaires</h1>
    <p>Bienvenue sur mon portfolio présentant trois de mes projets scolaires.</p>
    
    <div id="projectsCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <div class="d-flex justify-content-center">
                    <div class="card project-card">
                        <img src="images/awale.png" class="card-img-top" alt="Awale">
                        <div class="card-body">
                            <h5 class="card-title"><a href="awale.html">Awale</a></h5>
                            <p class="card-text">Un jeu traditionnel africain implémenté en Java.</p>
                        </div>
                    </div>
                    <div class="card project-card">
                        <img src="images/tourminator.jpg" class="card-img-top" alt="Tourminator">
                        <div class="card-body">
                            <h5 class="card-title"><a href="tourminator.html">Tourminator</a></h5>
                            <p class="card-text">Un jeu de stratégie en C++.</p>
                        </div>
                    </div>
                    <div class="card project-card">
                        <img src="images/puissance4.jpg" class="card-img-top" alt="Puissance 4">
                        <div class="card-body">
                            <h5 class="card-title"><a href="puissance4.html">Puissance 4</a></h5>
                            <p class="card-text">Le classique jeu de Puissance 4 en Python.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

            <span class="visually-hidden">Next</span>
        </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</html>
